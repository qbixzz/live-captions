[project]
name = "live-captions"
version = "0.2.0"
description = "Live English captions with a Thai translation in an always-on-top window, from the computer's speaker output. Runs locally on an NVIDIA GPU."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1",
    "transformers>=4.56",
    "torch>=2.6",
    "sentencepiece",
    "huggingface_hub",
    "numpy",
    "scipy",
    "pillow",
    "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
]

[project.scripts]
live-captions = "live_captions.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["live_captions"]

[tool.setuptools.package-data]
live_captions = ["assets/*"]

[tool.uv]
# uv.lock (used by setup.bat and the app's first-run setup) installs the versions this was tested with.
constraint-dependencies = [
    "torch==2.8.0",
    "transformers==4.57.6",
    "faster-whisper==1.2.1",
    "ctranslate2==4.9.0",
    "tokenizers==0.22.2",
    "huggingface-hub==0.36.2",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "PyAudioWPatch==0.2.12.9",
    "onnxruntime==1.32.0",
    "av==18.1.0",
]

# "uv sync" takes torch from the PyTorch CUDA 12.8 index (the PyPI build for Windows is CPU-only).
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
